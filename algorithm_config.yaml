# Optional reference configuration for MAAP registration.
# This GitHub URL becomes usable AFTER the new public repository is created.
algorithm_name: nisar-gcov-ease2-v1
algorithm_description: >-
  Convert NISAR L2 GCOV HDF5 granules to 50 m or 100 m EASE-Grid 2.0
  (EPSG:6933) linear-power gamma0/sigma0 GeoTIFFs with CRID-aware
  provisional/validated quality masking, optional filtering, mosaicking,
  and local-incidence-angle outputs.
algorithm_version: main
repository_url: https://github.com/preet0lal/nisar-gcov-ease2-maap.git
docker_container_url: mas.maap-project.org/root/maap-workspaces/custom_images/maap_base:v6.0.0
disk_space: 200GB
queue: maap-dps-worker-32vcpu-64gb
build_command: nisar-gcov-ease2-maap/build-env.sh
run_command: nisar-gcov-ease2-maap/run_maap.sh

inputs:
  file:
    - name: input_file
      description: MAAP-accessible NISAR L2 GCOV HDF5 URI; first overall positional argument
      required: true
  positional:
    # Order MUST match positional_names in run_maap.sh.
    - {name: ease2_res, required: false, default: "100", description: "EASE2 nominal resolution: 50 or 100 m"}
    - {name: mode, required: false, default: nofilt, description: "nofilt, enhanced_lee, gamma_map, or all"}
    - {name: filter_window, required: false, default: "7", description: "Odd filter window >= 3"}
    - {name: lia, required: false, default: "no", description: "Generate incidence and LIA rasters"}
    - {name: frequency, required: false, default: frequencyA, description: "frequencyA or frequencyB"}
    - {name: backscatter, required: false, default: gamma0, description: "gamma0 or sigma0 linear power"}
    - {name: clip_to_aoi, required: false, default: "no", description: "yes clips to bbox; no preserves full GCOV frames"}
    - {name: bbox_w, required: false, default: none, description: "West longitude (EPSG:4326); required only for clipping"}
    - {name: bbox_s, required: false, default: none, description: "South latitude (EPSG:4326); required only for clipping"}
    - {name: bbox_e, required: false, default: none, description: "East longitude (EPSG:4326); required only for clipping"}
    - {name: bbox_n, required: false, default: none, description: "North latitude (EPSG:4326); required only for clipping"}
